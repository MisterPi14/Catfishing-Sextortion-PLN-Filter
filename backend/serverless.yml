# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: ipnesimecu
service: pln-filter-backend

frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.11
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'} #cambio ia
  
  environment:
    IS_OFFLINE: ${param:offline, false} #cuando ejecutas sls invoke local Serverless NO inyecta IS_OFFLINE=true automáticamente python Asume que está en la nube, intenta conectarse a AWS real
    #${param:offline, false} significa: "Busca si en el comando escribieron --param="offline=true"", "Si lo escribieron, usa ese valor (true)." o "Si NO lo escribieron, usa el valor por defecto (false)."
    AWS_REGION: ${self:provider.region}
    DYNAMODB_TABLE: ${self:service}-${self:provider.stage}-messages
    DYNAMODB_USERS_TABLE: ${self:service}-${self:provider.stage}-users
    DYNAMODB_CONVERSATIONS_TABLE: ${self:service}-${self:provider.stage}-conversations
    #CAMBIO EN ESTAS 2 para usar la configuracion en el bloque custom
    SQS_QUEUE_URL: ${self:custom.config.${self:provider.stage}.SQS_QUEUE_URL}
    WEBSOCKET_API_ENDPOINT: ${self:custom.config.${self:provider.stage}.WEBSOCKET_API_ENDPOINT}
    AWS_ACCESS_KEY_ID: ${self:custom.awsKeys.${self:provider.stage}.accessKey}
    AWS_SECRET_ACCESS_KEY: ${self:custom.awsKeys.${self:provider.stage}.secretKey}

  
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - !GetAtt MessagesTable.Arn
            - !GetAtt UsersTable.Arn
            - !GetAtt ConversationsTable.Arn
        
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
          Resource: !GetAtt MessageQueue.Arn
        
        - Effect: Allow
          Action:
            - execute-api:ManageConnections
          Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebsocketApi}/*'

functions:
  receiveMessage:
    handler: handlers/receive_message.lambda_handler
    timeout: 30
    memorySize: 256
    events:
      - websocket:
          route: sendMessage
          authorizer:
            name: authorizer
            identitySource: method.request.header.Authorization
  
  getMessages:
    handler: handlers/get_messages.lambda_handler
    timeout: 30
    memorySize: 256
    events:
      - websocket:
          route: getMessages
          authorizer:
            name: authorizer
            identitySource: method.request.header.Authorization
  
  notifyUser:
    handler: handlers/notify_user.lambda_handler
    timeout: 30
    memorySize: 256

resources:
  Resources:
    MessagesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: conversationId
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: N
        KeySchema:
          - AttributeName: conversationId
            KeyType: HASH
          - AttributeName: timestamp
            KeyType: RANGE
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
    
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_USERS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
    
    ConversationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_CONVERSATIONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: conversationId
            AttributeType: S
        KeySchema:
          - AttributeName: conversationId
            KeyType: HASH
    
    MessageQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.queueName}
        VisibilityTimeout: 300
        MessageRetentionPeriod: 1209600
    
    WebsocketApi:
      Type: AWS::ApiGatewayV2::Api
      Properties:
        Name: ${self:service}-${self:provider.stage}-websocket
        ProtocolType: WEBSOCKET
        RouteSelectionExpression: $request.body.action

plugins:
  - serverless-dynamodb
  - serverless-offline-sqs
  - serverless-offline
  - serverless-python-requirements
custom:
  queueName: ${self:service}-${self:provider.stage}-messages

  pythonRequirements:
    dockerizePip: true
    slim: true
    strip: false
    layer: true
  
  dynamodb:
    stages:
      - local
    start:
      port: 8000
      inMemory: true
      migrate: true
      sharedDb: true
      accessKeyId: local
      secretAccessKey: local
      region: us-east-1
      
  config:
    local:
      SQS_QUEUE_URL: 'http://127.0.0.1:9324/queue/${self:custom.queueName}'
      WEBSOCKET_API_ENDPOINT: 'http://localhost:3001'
    dev:
      SQS_QUEUE_URL: !Ref MessageQueue
      WEBSOCKET_API_ENDPOINT: !Sub 'https://${WebsocketApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}'
    prod:
      SQS_QUEUE_URL: !Ref MessageQueue
      WEBSOCKET_API_ENDPOINT: !Sub 'https://${WebsocketApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}'

  serverless-offline-sqs:
    autoCreate: true                 # Crea la cola automáticamente
    apiVersion: '2012-11-05'
    host: 127.0.0.1                  # Forzar IP IPv4
    port: 9324
    endpoint: http://127.0.0.1:9324  # Endpoint explícito
    region: us-east-1
    accessKeyId: local
    secretAccessKey: local
    skipCacheInvalidation: false
  
  awsKeys:
    local:
      accessKey: local
      secretKey: local
    dev:
      accessKey: ''
      secretKey: ''
    prod:
      accessKey: ''
      secretKey: ''