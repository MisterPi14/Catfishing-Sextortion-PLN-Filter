# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: ipnesimecu
service: pln-filter-backend

frameworkVersion: '4'

provider:
  name: aws
  runtime: python3.11
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'} #cambio ia
  
  environment:
    IS_OFFLINE: ${env:IS_OFFLINE, 'true'}
    AWS_REGION: ${self:provider.region}
    DYNAMODB_TABLE: ${self:service}-${self:provider.stage}-messages
    DYNAMODB_USERS_TABLE: ${self:service}-${self:provider.stage}-users
    DYNAMODB_CONVERSATIONS_TABLE: ${self:service}-${self:provider.stage}-conversations
    
    SQS_QUEUE_URL: ${self:custom.config.${self:provider.stage}.SQS_QUEUE_URL}
    SQS_ENDPOINT: ${self:custom.config.${self:provider.stage}.SQS_ENDPOINT}
    DYNAMODB_ENDPOINT: ${self:custom.config.${self:provider.stage}.DYNAMODB_ENDPOINT}
    WEBSOCKET_API_ENDPOINT: ${self:custom.config.${self:provider.stage}.WEBSOCKET_API_ENDPOINT}
    AWS_ACCESS_KEY_ID: ${self:custom.awsKeys.${self:provider.stage}.accessKey}
    AWS_SECRET_ACCESS_KEY: ${self:custom.awsKeys.${self:provider.stage}.secretKey}

  
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - !GetAtt MessagesTable.Arn
            - !GetAtt UsersTable.Arn
            - !GetAtt ConversationsTable.Arn
        
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
          Resource: !GetAtt MessageQueue.Arn
        
        - Effect: Allow
          Action:
            - execute-api:ManageConnections
          Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebsocketApi}/*'

functions:
  authorizer:
    handler: handlers/auth.lambda_handler

  connect:
    handler: handlers/connect.lambda_handler
    events:
      - websocket:
          route: $connect
          authorizer:
            name: authorizer
            identitySource: method.request.header.Authorization

  disconnect:
    handler: handlers/connect.disconnect_handler
    events:
      - websocket:
          route: $disconnect

  receiveMessage:
    handler: handlers/receive_message.lambda_handler
    timeout: 30
    memorySize: 256
    events:
      - websocket:
          route: sendMessage
  
  getMessages:
    handler: handlers/get_messages.lambda_handler
    timeout: 30
    memorySize: 256
    events:
      - websocket:
          route: getMessages
  
  notifyUser:
    handler: handlers/notify_user.lambda_handler
    timeout: 30
    memorySize: 256

  register:
    handler: handlers/user_management.register
    events:
      - http:
          path: register
          method: post
          cors:
            origin: 'http://localhost:5173'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: true
            
  checkUser:
    handler: handlers/user_management.check_user
    events:
      - http:
          path: check-user/{username}
          method: get
          cors:
            origin: 'http://localhost:5173'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: true

  login:
    handler: handlers/user_management.login
    events:
      - http:
          path: login
          method: post
          cors:
            origin: 'http://localhost:5173'
            headers:
              - Content-Type
              - Authorization
            allowCredentials: true

resources:
  Resources:
    MessagesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: conversationId
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: N
        KeySchema:
          - AttributeName: conversationId
            KeyType: HASH
          - AttributeName: timestamp
            KeyType: RANGE
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES
    
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_USERS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
    
    ConversationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_CONVERSATIONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: conversationId
            AttributeType: S
        KeySchema:
          - AttributeName: conversationId
            KeyType: HASH
    
    MessageQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.queueName}
        VisibilityTimeout: 300
        MessageRetentionPeriod: 1209600
    
    WebsocketApi:
      Type: AWS::ApiGatewayV2::Api
      Properties:
        Name: ${self:service}-${self:provider.stage}-websocket
        ProtocolType: WEBSOCKET
        RouteSelectionExpression: $request.body.action

plugins:
  - serverless-localstack
  - serverless-offline
  - serverless-plugin-scripts
  
custom:
  scripts:
    hooks:
      'deploy:finalize': node scripts/update-env.js
  queueName: ${self:service}-${self:provider.stage}-messages

  localstack:
    stages:
      - local
      - dev
    host: localhost
    edgePort: 4566
    autostart: false
    lambda:
      mountCode: false
    docker:
      sudo: false

  pythonRequirements:
    dockerizePip: true
    slim: true
    strip: false
    layer: true
  
  config:
    local:
      SQS_QUEUE_URL: 'http://localhost:4566/000000000000/${self:custom.queueName}'
      SQS_ENDPOINT: 'http://localhost:4566'
      DYNAMODB_ENDPOINT: 'http://localhost:4566'
      WEBSOCKET_API_ENDPOINT: 'http://localhost:3001'
    dev:
      SQS_QUEUE_URL: !Ref MessageQueue
      SQS_ENDPOINT: ''
      DYNAMODB_ENDPOINT: ''
      WEBSOCKET_API_ENDPOINT: !Sub 'https://${WebsocketApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}'
    prod:
      SQS_QUEUE_URL: !Ref MessageQueue
      SQS_ENDPOINT: ''
      DYNAMODB_ENDPOINT: ''
      WEBSOCKET_API_ENDPOINT: !Sub 'https://${WebsocketApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}'

  awsKeys:
    local:
      accessKey: local
      secretKey: local
    dev:
      accessKey: ''
      secretKey: ''
    prod:
      accessKey: ''
      secretKey: ''